name: Release

# Push a tag like v0.2.0 to publish a release with:
#   dashboard.tar.gz     prebuilt dashboard, downloaded by deploy/install.sh
#   smartify-cloud.zip   remote dashboard for web hosting (see cloud/README.md)
#   installer.php        one-file installer/updater for the remote dashboard
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: scripts/build-cloud.sh
      - run: tar -czf dist/dashboard.tar.gz -C frontend/dist .
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/dashboard.tar.gz
            dist/smartify-cloud.zip
            dist/installer.php
