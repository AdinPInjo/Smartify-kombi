<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Smartify Kombi</title>
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#2b3025"/>
      <stop offset="1" stop-color="#151810"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#glow)"/>
    <!-- topographic contour lines -->
    <g fill="none" stroke="#3a4032" stroke-width="3" opacity="0.7">
      <path d="M-20 420 C 80 380, 140 450, 250 410 S 420 360, 540 400"/>
      <path d="M-20 455 C 90 420, 160 490, 260 450 S 430 400, 540 440"/>
      <path d="M-20 490 C 100 460, 170 525, 270 488 S 440 440, 540 480"/>
      <path d="M-20 92 C 70 60, 150 120, 250 84 S 410 40, 540 74"/>
      <path d="M-20 58 C 80 26, 160 86, 260 50 S 420 6, 540 40"/>
    </g>
    <!-- signal: the van is connected -->
    <g fill="none" stroke="#f0a43a" stroke-linecap="round" stroke-width="16">
      <path d="M226 132 a 42 42 0 0 1 60 0" opacity="0.55"/>
      <path d="M196 104 a 84 84 0 0 1 120 0" opacity="0.3"/>
    </g>
    <circle cx="256" cy="160" r="13" fill="#f0a43a"/>
    <!-- van, side view -->
    <g fill="none" stroke="#f0a43a" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
      <path d="M108 344 V 232 Q 108 204 136 204 H 336 Q 360 204 374 226 L 404 278 Q 412 292 412 308 V 344"/>
      <path d="M108 344 H 140 M 212 344 H 300 M 372 344 H 412"/>
      <path d="M108 290 H 405"/>
    </g>
    <!-- windows -->
    <g fill="#f0a43a" opacity="0.9">
      <rect x="138" y="228" width="58" height="40" rx="9"/>
      <rect x="212" y="228" width="58" height="40" rx="9"/>
      <rect x="286" y="228" width="44" height="40" rx="9"/>
      <path d="M346 228 H 352 Q 360 228 364 235 L 378 260 Q 382 268 373 268 H 346 Z"/>
    </g>
    <!-- wheels -->
    <g fill="#151810" stroke="#f0a43a" stroke-width="18">
      <circle cx="176" cy="346" r="34"/>
      <circle cx="336" cy="346" r="34"/>
    </g>
    <g fill="#f0a43a">
      <circle cx="176" cy="346" r="9"/>
      <circle cx="336" cy="346" r="9"/>
    </g>
    <!-- ground line -->
    <path d="M84 404 H 428" stroke="#6f7562" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
