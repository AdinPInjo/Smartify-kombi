[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smartify-kombi"
version = "0.11.0"
description = "Raspberry Pi controller for camper vans: relays, temperature/humidity, water level, GPS and remote sync."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "itsdangerous>=2.1",  # signed session cookies
    "diesel-heater-ble>=0.3.10",  # diesel heater Bluetooth protocols (pure Python, MIT)
]

[project.optional-dependencies]
# Hardware drivers, only needed on the Raspberry Pi.
pi = [
    "smbus2>=0.5",
    "pyserial>=3.5",
    "adafruit-circuitpython-dht>=4.0",
    "gpiod>=2.2.2,<3",  # GPIO backend Adafruit Blinka needs on Raspberry Pi OS Bookworm/Trixie
    "victron-ble>=0.9",
    # I2C climate sensors from the Sensors tab
    "adafruit-circuitpython-bme280>=2.6",
    "adafruit-circuitpython-sht31d>=2.3",
    "adafruit-circuitpython-ahtx0>=1.0",
]
dev = [
    "victron-ble>=0.9",  # decoding is tested with real encrypted advertisements
    "pyserial>=3.5",  # the GPS receiver is tested with a fake serial port
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
smartify = "smartify.__main__:main"

[tool.setuptools.packages.find]
include = ["smartify*"]

[tool.setuptools.package-data]
"smartify.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
