[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartify-kombi"
version = "0.2.0.dev0"
description = "Raspberry Pi controller for camper vans: relays, temperature/humidity, water level, GPS and remote sync."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "itsdangerous>=2.1",  # signed session cookies
]

[project.optional-dependencies]
# Hardware drivers, only needed on the Raspberry Pi.
pi = [
    "smbus2>=0.5",
    "pyserial>=3.5",
    "adafruit-circuitpython-dht>=4.0",
    "victron-ble>=0.9",
]
dev = [
    "victron-ble>=0.9",  # decoding is tested with real encrypted advertisements
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
smartify = "smartify.__main__:main"

[tool.setuptools.packages.find]
include = ["smartify*"]

[tool.setuptools.package-data]
"smartify.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
