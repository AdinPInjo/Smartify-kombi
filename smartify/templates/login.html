<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Smartify Login</title>
  <style>
    body { font-family: system-ui, sans-serif; display:flex; min-height:100vh; align-items:center; justify-content:center; background:#111; color:#eee; }
    .card { width: 360px; background:#1b1b1b; padding:24px; border-radius:16px; box-shadow: 0 10px 30px rgba(0,0,0,.4); border:1px solid #2a2a2a;}
    input { width:100%; padding:12px; border-radius:10px; border:1px solid #333; background:#0f0f0f; color:#eee; margin-top:10px; }
    button { width:100%; padding:12px; border-radius:10px; border:none; margin-top:14px; font-weight:600; cursor:pointer; }
    .err { color:#ff6b6b; margin-top:10px; }
    h1 { margin:0 0 8px; font-size:20px; }
    p { margin:0 0 14px; opacity:.8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Smartify</h1>
    <p>Login to your van dashboard</p>
    <form method="post" action="/login">
      <input name="username" placeholder="Username" required />
      <input name="password" type="password" placeholder="Password" required />
      <button type="submit">Login</button>
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
    </form>
  </div>
</body>
</html>
